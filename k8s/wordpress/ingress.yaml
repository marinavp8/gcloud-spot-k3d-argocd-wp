apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: wordpress-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [wp.example.sslip.io]   # lo sustituye la Application de ArgoCD
      secretName: wordpress-tls
  rules:
    - host: wp.example.sslip.io      # lo sustituye la Application de ArgoCD
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  number: 80
